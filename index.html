<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eee6d8"><title>Halve | Menu</title><style>
:root{--bg:#eee7d9;--ink:#34392f;--olive:#818772;--line:#c6b99e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Noto Serif',serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--olive);outline-offset:3px}#welcome{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 22px}.hero{text-align:center;max-width:440px;width:100%}.welcome-title{font-size:clamp(25px,6vw,36px);font-weight:normal;letter-spacing:.04em;margin:0 0 38px}.logo{display:block;width:min(78vw,320px);height:auto;margin:0 auto 42px}.lang-buttons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.lang-buttons button,.switch button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:13px 18px;min-height:46px}.lang-buttons button:hover,.switch button.active{background:var(--olive);color:#fff}.menu{max-width:720px;margin:auto;padding:18px 18px 90px}.menu-top{display:flex;align-items:center;gap:15px;justify-content:space-between;padding:10px 0 15px;border-bottom:1px solid var(--line)}.small-logo{width:85px;height:85px;object-fit:contain}.switch{display:flex;gap:5px}.switch button{padding:9px 10px;min-height:38px;font-size:12px}.menu-heading{text-align:center;font-size:30px;font-weight:normal;margin:26px 0}.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 0 14px;margin-bottom:10px}.tabs button{white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:50px;padding:12px 15px;min-height:44px}.tabs button.active{background:var(--olive);color:white}.category{border:1px solid var(--line);border-radius:17px;padding:12px 18px 14px}.category h2{text-align:center;font-size:26px;font-weight:normal;margin:15px 0 19px}.dish{width:100%;background:transparent;border:0;border-bottom:1px solid #c6b99e80;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:16px;padding:15px 0;min-height:56px}.dish:last-child{border-bottom:0}.dish .name{font-size:17px;line-height:1.35}.dish .price{font-size:15px;white-space:nowrap;flex-shrink:0}dialog{border:0;border-radius:18px;padding:0;background:var(--bg);color:var(--ink);width:min(92vw,460px);max-height:90svh;overflow:auto;box-shadow:0 18px 60px #0003}dialog::backdrop{background:#151b14b8}.modal-body{padding:18px 20px 28px}.modal-close{position:absolute;right:14px;top:14px;border:1px solid var(--line);background:var(--bg);width:38px;height:38px;border-radius:50%;font-size:25px}.dish-photo{width:100%;height:260px;object-fit:contain;background:#e3dacc;border-radius:13px;display:block}.no-photo{display:grid;place-items:center;text-align:center;font:14px/1.5 Arial,sans-serif;color:#777;padding:30px}.modal-body h3{font-size:26px;font-weight:normal;margin:18px 0 10px}.modal-price{font-size:21px}.note{font:12px/1.5 Arial,sans-serif;color:#74786b}.hidden{display:none!important}@media(min-width:600px){.menu{padding-left:30px;padding-right:30px}}
</style></head><body><div id="welcome"><div class="hero"><h1 class="welcome-title">Welcome to Halve</h1><img class="logo" src="assets/halve-logo.png" alt="Original Halve logo"><div class="lang-buttons"><button data-select="hy">Հայերեն</button><button data-select="ru">Русский</button><button data-select="en">English</button></div></div></div><main id="menu" class="menu hidden"><header class="menu-top"><img class="small-logo" src="assets/halve-logo.png" alt="Halve"><div class="switch"><button data-switch="hy">Հայ</button><button data-switch="ru">Рус</button><button data-switch="en">Eng</button></div></header><h1 class="menu-heading" id="menu-heading"></h1><nav class="tabs" id="tabs" aria-label="Menu categories"></nav><section class="category"><h2 id="category-title"></h2><div id="items"></div></section></main><dialog id="modal" aria-label="Dish details"><button class="modal-close" id="close" aria-label="Close">×</button><div class="modal-body"><div id="photo-box"></div><h3 id="modal-title"></h3><div class="modal-price" id="modal-price"></div><p class="note" id="modal-note"></p></div></dialog><script src="menu.js"></script><script>
const langs={en:0,ru:1,hy:2};const labels={en:{menu:'Our Menu',photo:'Photo is being prepared',note:'Illustrative photo from the original printed menu. Presentation may vary.'},ru:{menu:'Наше меню',photo:'Фотография готовится',note:'Фото взято из оригинального печатного меню. Подача может отличаться.'},hy:{menu:'Մեր ճաշացանկը',photo:'Լուսանկարը պատրաստվում է',note:'Լուսանկարը վերցված է բնօրինակ ճաշացանկից։ Մատուցումը կարող է տարբերվել։'}};let language='en',selected=0;const $=id=>document.getElementById(id);const modal=$('modal');function render(){document.documentElement.lang=language;const i=langs[language];$('menu-heading').textContent=labels[language].menu;$('tabs').replaceChildren(...categories.map((c,k)=>{const b=document.createElement('button');b.textContent=c.names[i];b.className=k===selected?'active':'';b.onclick=()=>{selected=k;render()};return b}));$('category-title').textContent=categories[selected].names[i];$('items').replaceChildren(...categories[selected].items.map((dish,k)=>{const b=document.createElement('button');b.className='dish';const name=document.createElement('span');name.className='name';name.textContent=dish[i];const price=document.createElement('span');price.className='price';price.textContent=dish[3]+' ֏';b.append(name,price);b.onclick=()=>openDish(dish,k);return b}));document.querySelectorAll('[data-switch]').forEach(b=>{b.classList.toggle('active',b.dataset.switch===language);b.setAttribute('aria-pressed',String(b.dataset.switch===language))})}function openDish(dish,k){$('modal-title').textContent=dish[langs[language]];$('modal-price').textContent=dish[3]+' ֏';const image='assets/dish-'+selected+'-'+k+'.webp';const hasPhoto=(selected<=4&&((selected===0&&k<=4)||(selected===1&&k<=6)||(selected===2&&k<=1)||(selected===3&&k<=2)||(selected===4&&k<=3)));$('photo-box').replaceChildren();if(hasPhoto){const img=document.createElement('img');img.className='dish-photo';img.src=image;img.alt=dish[langs[language]];img.onerror=()=>{img.replaceWith(noPhoto())};$('photo-box').append(img);$('modal-note').textContent=labels[language].note}else{$('photo-box').append(noPhoto());$('modal-note').textContent=''}modal.showModal()}function noPhoto(){const div=document.createElement('div');div.className='dish-photo no-photo';div.textContent=labels[language].photo;return div}function selectLang(l){language=l;sessionStorage.setItem('halve-lang',l);$('welcome').classList.add('hidden');$('menu').classList.remove('hidden');render();window.scrollTo(0,0)}document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>selectLang(b.dataset.select));document.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{language=b.dataset.switch;sessionStorage.setItem('halve-lang',language);render()});$('close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});
</script></body></html>
