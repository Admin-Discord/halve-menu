<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eee6d8"><title>Halve | Menu Preview</title><style>:root{--bg:#eee6d8;--ink:#353a30;--olive:#79836d;--line:#c6b89d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}main{max-width:640px;margin:auto;padding:38px 20px 80px}header{text-align:center;padding:12px 0 26px}.logo{font-size:62px;letter-spacing:-4px;font-style:italic;line-height:1.1}.sub{font:11px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase}.welcome{font-size:17px;letter-spacing:2px;margin:34px 0 22px}.langs,.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tabs{justify-content:flex-start;margin:24px 0}.langs button,.tabs button{border:1px solid var(--line);background:transparent;border-radius:22px;padding:11px 15px;color:var(--ink);font:14px Georgia;cursor:pointer}.langs .active,.tabs .active{background:var(--olive);color:white;border-color:var(--olive)}h1{text-align:center;font-size:29px;font-weight:normal;margin:30px 0 8px}.rule{height:1px;background:var(--line);margin:20px 0}.category{font-size:25px;text-align:center;font-weight:normal;margin:20px 0}section{border:1px solid var(--line);padding:10px 20px 16px;border-radius:14px}button.dish{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid #c6b89d80;text-align:left;padding:17px 0;font:17px Georgia;color:var(--ink);cursor:pointer}.dish:last-child{border:0}.price{font-size:14px;white-space:nowrap;margin-left:12px}dialog{border:0;border-radius:20px;background:var(--bg);color:var(--ink);width:min(92%,450px);padding:20px}dialog::backdrop{background:#172018aa}.close{float:right;background:none;border:0;font-size:28px;cursor:pointer}.placeholder{height:210px;background:#ddd3c1;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:20px;font:14px Arial;color:#6d725f}dialog h2{font-size:27px;font-weight:normal}footer{text-align:center;font:12px Arial;margin-top:40px;color:#777}button:focus-visible{outline:2px solid #353a30;outline-offset:3px}</style></head><body><main><header><div class="logo">Halve</div><div class="sub">pastry · coffee · and more</div><p class="welcome">Welcome to Halve</p><div class="langs"><button data-lang="hy">Հայերեն</button><button data-lang="ru">Русский</button><button data-lang="en">English</button></div></header><h1 id="heading">Our Menu</h1><div class="rule"></div><nav class="tabs" id="tabs"></nav><section><h2 class="category" id="category"></h2><div id="dishes"></div></section><footer>Halve · interactive menu preview</footer></main><dialog id="details"><button class="close" id="close" aria-label="Close">×</button><div class="placeholder" id="photo"></div><h2 id="dishName"></h2><p id="dishPrice"></p><p id="note"></p></dialog><script>const text={en:{heading:"Our Menu",photo:"Dish photo will appear here after approval",note:"Preview only. Photos and descriptions are being prepared.",cats:["Sweet Breakfast","Halve Brunch","Desserts","Coffee","Tea","Drinks"]},ru:{heading:"Наше меню",photo:"Здесь появится согласованная фотография блюда",note:"Демонстрация. Фотографии и описания готовятся.",cats:["Сладкие завтраки","Бранч","Десерты","Кофе","Чай","Напитки"]},hy:{heading:"Մեր ճաշացանկը",photo:"Այստեղ կհայտնվի ուտեստի հաստատված լուսանկարը",note:"Ցուցադրական տարբերակ։ Լուսանկարները և նկարագրությունները պատրաստվում են։",cats:["Քաղցր նախաճաշ","Բրանչ","Աղանդեր","Սուրճ","Թեյ","Ըմպելիքներ"]}};const items=[[[ "Pancakes","Панкейки","Փանքեյք"],["Belgian waffle","Бельгийские вафли","Բելգիական վաֆլի"],["Oatmeal","Овсяная каша","Վարսակի շիլա"]],[[ "Halve brunch","Бранч Halve","Halve բրանչ"],["Sandwich","Сэндвич","Սենդվիչ"]],[[ "Desserts","Десерты","Աղանդեր"]],[[ "Espresso","Эспрессо","Էսպրեսո"],["Cappuccino","Капучино","Կապուչինո"]],[[ "Tea","Чай","Թեյ"]],[[ "Smoothie","Смузи","Սմուզի"],["Lemonade","Лимонад","Լիմոնադ"]]];let lang=localStorage.getItem("halve-lang")||"en",selected=0;const idx=()=>({en:0,ru:1,hy:2})[lang];function render(){document.documentElement.lang=lang;document.getElementById("heading").textContent=text[lang].heading;document.querySelectorAll("[data-lang]").forEach(b=>{b.classList.toggle("active",b.dataset.lang===lang);b.setAttribute("aria-pressed",b.dataset.lang===lang)});document.getElementById("tabs").replaceChildren(...text[lang].cats.map((c,i)=>{const b=document.createElement("button");b.textContent=c;b.className=i===selected?"active":"";b.onclick=()=>{selected=i;render()};return b}));document.getElementById("category").textContent=text[lang].cats[selected];document.getElementById("dishes").replaceChildren(...items[selected].map(a=>{const b=document.createElement("button");b.className="dish";const n=document.createElement("span");n.textContent=a[idx()];const p=document.createElement("span");p.className="price";p.textContent="›";b.append(n,p);b.onclick=()=>{document.getElementById("dishName").textContent=a[idx()];document.getElementById("photo").textContent=text[lang].photo;document.getElementById("note").textContent=text[lang].note;document.getElementById("dishPrice").textContent="";document.getElementById("details").showModal()};return b}))}document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("halve-lang",lang);render()});document.getElementById("close").onclick=()=>document.getElementById("details").close();render();</script></body></html>
